apiVersion: apps/v1  
kind: Deployment  
metadata:  
  name: whoami  
  namespace: lab  
spec:  
  replicas: 3  
  selector:  
    matchLabels:  
      app: whoami  
  template:  
    metadata:  
      labels:  
        app: whoami  
    spec:  
      containers:  
        - name: whoami  
          image: traefik/whoami:v1.10.3  
          ports:  
            - containerPort: 80  
---  
apiVersion: v1  
kind: Service  
metadata:  
  name: whoami  
  namespace: lab  
spec:  
  selector:  
    app: whoami  
  ports:  
    - port: 80  
      targetPort: 80  